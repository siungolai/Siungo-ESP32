; dht11-oled —— DHT11 温湿度实时监测 + SSD1306 128x64 I2C OLED
; 板卡：ESP32-S3-DevKitC-1 N16R8（16MB Flash + 8MB OPI PSRAM）
; 与同仓库的 blink3 / pin-probe / uptime-oled 保持同一套板卡配置。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

; 引脚都不在这里配：DHT11 数据脚与 I2C 的 SCL/SDA 都是运行期指定的，
; 编号写在 src/main.cpp 顶部的 PIN_DHT_DATA / PIN_I2C_SCL / PIN_I2C_SDA，
; 要换脚只改那三个常量，本文件不动。

; ---- 第三方库：无 ----
; DHT11 时序与 SSD1306 驱动都是本仓库自写（src/dht11.h、src/ssd1306_i2c.cpp），
; 只用 Arduino core 自带的 API。
;
; 为什么不用现成的 Adafruit DHT library（本项目最初用的就是它，实机撞了两个坑）：
;   1. 它没有"读一次拿温湿度两个值"的接口。DHT11 的 40 位是一次不可分割的
;      传输，但库把 data[5] 设成 private，想同时要两个量只能调
;      readHumidity() + readTemperature() 两次 —— 而 DHT11 两次转换之间
;      要求 ≥1s，背靠背连调两次，第二次读到的是垃圾。
;      实机症状：湿度正常、温度永远显示 `--`。
;   2. 它的超时是关中断自旋（expectPulse 里的 while），传感器不在线时
;      会自旋到看门狗整板重启。
; 自写时序一次传输解出全部 5 字节，且每个等待循环都有 cycle 上限。
; 详见 README 的「为什么不用 Adafruit 的 DHT 库」一节。
