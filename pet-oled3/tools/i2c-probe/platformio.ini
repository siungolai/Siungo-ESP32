; i2c-probe -- M0 diagnostic tool for pet-oled3
;
; A standalone PlatformIO project (its own src/setup+loop) that produces
; facts about the pet-oled3 bench wiring before any product firmware is
; written. It answers, in one flashing:
;
;   Phase A: are SDA and SCL swapped? It tests the bench order
;            (SDA=GPIO5, SCL=GPIO4) and the crossed order
;            (SDA=GPIO4, SCL=GPIO5) on the same two pins, scanning
;            0x08..0x77 and reporting the endTransmission() error code
;            for every address (0=ACK, 2=nack_addr, 3=nack_data,
;            4=other, 5=TIMEOUT).
;   Phase B: for the order that ACKs the PCA9548A at 0x70, select mux
;            channel 0/1/2 one at a time and check whether the SSD1306 at
;            0x3C answers behind each channel.
;
; Nothing here is shipped: this project exists only to produce facts.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
