; pet-oled3 —— ESP32-S3 + PCA9548A + 三块 SSD1306 桌面电子宠物
; 板卡：ESP32-S3-DevKitC-1 N16R8（16MB Flash + 8MB OPI PSRAM）
; 与同仓库的 blink3 / pin-probe / uptime-oled / clock-oled / status-oled3
; 保持同一套板卡配置。
;
; 当前是 M0（硬件 bringup）：只验证 PCA9548A + 三屏链路、两个按钮、一个蜂鸣器，
; 不联网、不做游戏数值（三条数值到 M3 才有）。见 docs/策划案.md 第 6 章。
;
; 硬件接口与 status-oled3 完全一致（见 docs/adr/0006）：
;   I2C   SDA = GPIO5，SCL = GPIO4（线序不可换）
;   按钮  A = GPIO6，B = GPIO7（内部上拉，按下接地）
;   蜂鸣器  GPIO21（有源型，HIGH 响；驱动强度必须提到 GPIO_DRIVE_CAP_3）

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

; I2C 引脚不在这里配：ESP32 的 Wire 允许运行期指定 SCL/SDA，
; 编号写在 src/config.h 的 I2C_SDA_PIN / I2C_SCL_PIN。
; 要换脚只改那两行常量，本文件不动。
; 换板子（如普通 8MB Flash 无 PSRAM 的 S3-DevKitC-1）时，
; 去掉 board_build.arduino.memory_type 那一行。
