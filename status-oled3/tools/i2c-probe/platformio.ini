; i2c-probe -- M0 diagnostic tool for status-oled3
;
; A standalone PlatformIO project (its own src/setup+loop) that probes the
; upstream I2C bus on GPIO8/GPIO9 and, for comparison, on the known-good
; GPIO4/GPIO5 pair. It answers the questions the boot report cannot:
;
;   1. does the bus time out (error 5) or just get no ACK (error 2)?
;   2. is anything alive at all, and at which address?
;   3. are the SDA/SCL lines actually pulled up?
;
; Nothing here is shipped: this project exists only to produce facts.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
