; status-oled3 —— ESP32-S3 + PCA9548A + 三块 SSD1306 桌面状态显示器
; 板卡：ESP32-S3-DevKitC-1 N16R8（16MB Flash + 8MB OPI PSRAM）
; 与同仓库的 blink3 / pin-probe / uptime-oled / clock-oled 保持同一套板卡配置。
;
; 当前是 M0（硬件 bringup）：只验证 PCA9548A + 三屏链路、两个按钮、一个蜂鸣器，
; 不联网、不轮询数据源。WiFi 与轮询属于 M1，见 docs/adr/0009。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

; I2C 引脚不在这里配：ESP32 的 Wire 允许运行期指定 SCL/SDA，
; 编号写在 src/config.h 的 I2C_SCL_PIN / I2C_SDA_PIN。
; 要换脚只改那两行常量，本文件不动。
; 换板子（如普通 8MB Flash 无 PSRAM 的 S3-DevKitC-1）时，
; 去掉 board_build.arduino.memory_type 那一行。
