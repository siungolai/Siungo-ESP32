; status-oled —— SSD1306 128x64 I2C OLED 单屏显示 ESP32 自身状态
; 板卡：ESP32-S3-DevKitC-1 N16R8（16MB Flash + 8MB OPI PSRAM）
; 与同仓库的 blink3 / pin-probe / uptime-oled 保持同一套板卡配置。
;
; 本机坑一：board=esp32-s3-devkitc-1 在 platform 7.1.3 下解析成
; 「8MB Flash、无 PSRAM」，N16R8 的 16MB Flash 完全靠 board_upload.flash_size 撑住。
;
; 本机坑二（2026-10-15 实测坐实）：board 解析出来的名字是
;   "Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)"
; 于是 boards.txt 里 esp32s3.menu.PSRAM.* 那组选项目标（它们才带
; -DBOARD_HAS_PSRAM）根本不会被应用。后果是 Arduino 的 psramFound() 编译成
; 恒返回 false 的桩，ESP.getPsramSize() 永远返回 0——但 IDF 其实已经把
; PSRAM 加进堆了，heap_caps_malloc(MALLOC_CAP_SPIRAM) 能正常分配并读写。
; 症状：屏上 P2 的 MEM 行显示 16M+0K，而板子实有 8MB。
; 修法就是下面 build_flags 里补的那一行 -DBOARD_HAS_PSRAM。
; 注意 board_build.arduino.memory_type=qio_opi 只管链接期内存布局，
; 管不到这个运行期标志位，两者必须都在。详见 HARDWARE.md §1.3。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; I2C 与按钮引脚不在这里配：ESP32 的 Wire 允许运行期指定 SCL/SDA，
; 编号写在 src/config.h 的 I2C_SCL_PIN / I2C_SDA_PIN / PIN_BUTTON_PAGE。
; 要换脚只改那三个常量，本文件不动。
