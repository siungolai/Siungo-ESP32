; rlcd-workbench —— ESP32-S3-RLCD 4.2 寸单屏工作台
; 目标板：Waveshare ESP32-S3-RLCD-4.2（ESP32-S3-WROOM-1-N16R8，16MB Flash + 8MB OPI PSRAM）
;
; 与仓库其他工程的差异（见 docs/adr/0012）：
;   1. 只有本项目**锁** platform 版本 → espressif32@~8.0.0（Arduino-ESP32 3.3.x / IDF 5.5.x）。
;      其余工程是未锁版本的 `platform = espressif32`，当前解析到 7.1.3 / Arduino 2.0.17 / IDF 4.4.7。
;      本项目要用 IDF 5 的 i2c_master 驱动，2.0.17 里没有。
;   2. 只有本项目用**独立的 PlatformIO core 目录**（见下面 core_dir），
;      这样装 8.0.0 不会把其他工程的 7.1.3 顶掉。缺点是首次构建要把工具链
;      重新下一份（约 1 GB），装过之后就好了。
;
; 硬件引脚不在这里配：全部常量集中在 src/config.h，换板时改那里。

[platformio]
; 独立 core 目录，放在仓库之外。
; 为什么不放仓库里：完整的 8.0.0 依赖（xtensa + riscv 两套工具链 + framework +
; arduino-libs）解压后超过 5 GB，而 W: 盘只剩 4.7 GB，放不下（第一次尝试就是这么
; 撞上 "No space left on device" 的）。C: 还有 185 GB。
; 换机器时改这一行，或者设 PLATFORMIO_CORE_DIR 环境变量覆盖。
core_dir = C:/Users/EmoBS/.platformio-rlcd

[env:esp32-s3-devkitc-1]
platform = espressif32@~8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; BOARD_HAS_PSRAM 与 memory_type=qio_opi 两者都需要，缺一则 psramFound() 恒 false
; （HARDWARE.md §1.3.1）。串口日志只用 ASCII —— ESP32 的 Serial 出中文容易乱码。
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; 必须显式 -O2。实测（M0，同一块板同一个测试页）：
    ;   默认优化档 → draw 12.4 ms/帧、flush 16.1 ms、34 fps
    ;   -O2        → draw  3.4 ms/帧、flush  9.5 ms、72 fps
    ; 默认档下 u8g2 的单像素绘制要 1.2 us（240 MHz 的机器不该这么慢），
    ; 说明框架默认的 -Os 在这套 u8g2 + Arduino-ESP32 3.3.x 组合下退化得厉害。
    -O2

; U8g2 只取字库与绘图引擎，ST7305 的显示驱动是自建的（官方例程封装不足以
; 支撑局部刷新与模式命令，见 docs/adr/0001 与 0004）。
;
; esp_codec_dev 是本地库（lib/esp_codec_dev/），不写在这里：
; 它在 PlatformIO registry 里 404（ADR-0011 事实盘点），只能随仓库带着走。
; 源码取自官方归档 07_Audio_Test 的 ExternLib，已按 ADR-0022 决策 §6 裁剪——
; 只留 ES8311 播放路径，去掉 codec_board / ES7210 / tca9554。
; 依赖图里会自动出现（LDF finder ~ chain）。
lib_deps =
    olikraus/U8g2@2.36.18
