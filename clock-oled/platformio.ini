; clock-oled —— SSD1306 128x64 I2C OLED 时间与日期显示
; 板卡：ESP32-S3-DevKitC-1 N16R8（16MB Flash + 8MB OPI PSRAM）
; 与同仓库的 uptime-oled / dht11-oled / blink3 保持同一套板卡配置。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

; I2C 引脚不在这里配：ESP32 的 Wire 允许运行期指定 SCL/SDA，
; 编号写在 src/main.cpp 顶部的 PIN_I2C_SCL / PIN_I2C_SDA。
; 要换脚只改那两个常量，本文件不动。
; 换板子（如普通 8MB Flash 无 PSRAM 的 S3-DevKitC-1）时，
; 去掉 board_build.arduino.memory_type 那一行。
